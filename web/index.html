<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fixline · IT help desk</title>
  <meta name="description" content="A fast IT help desk: live ticket queue with response-time targets, suggested fixes, known-issue banners and a simple employee portal." />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script>
    try { const t = localStorage.getItem('fixline-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
