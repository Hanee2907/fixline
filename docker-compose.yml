# Fixline with a real PostgreSQL: docker compose up, then open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fixline
      POSTGRES_PASSWORD: fixline
      POSTGRES_DB: fixline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixline"]
      interval: 3s
      retries: 20
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://fixline:fixline@db:5432/fixline
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
