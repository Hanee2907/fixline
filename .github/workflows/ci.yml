name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The API tests run against a real PostgreSQL here (and against PGlite on a laptop).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fixline
          POSTGRES_PASSWORD: fixline
          POSTGRES_DB: fixline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixline"
          --health-interval 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and API tests (API against PostgreSQL)
        run: npm test
        env:
          DATABASE_URL: postgres://fixline:fixline@localhost:5432/fixline_test
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests (production build)
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      - name: Docker image builds
        run: docker build -t fixline .
